<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn the ideas behind the US amateur radio exams — Technician, General and Extra — from the official question pools, with visuals instead of walls of text." />
    <meta name="theme-color" content="#0b1218" />
    <title>Hamplitude — don't memorize ham radio, understand it</title>
    <script>
      // set theme before paint to avoid a flash
      try {
        var t = JSON.parse(localStorage.getItem('hamplitude:v1') || '{}').settings?.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

  </body>
